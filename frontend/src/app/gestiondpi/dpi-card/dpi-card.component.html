<link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  rel="stylesheet"
/>
<div class="flex flex-col justify-between bg-white shadow-slate-200 rounded-lg p-5 mb-4" >
  <h2 class="text-3xl font-bold font-poppins text-primaryBlue">
    {{ patientName }}
  </h2>
  <div class="flex xl:flex-row sm:flex-col" >
    <div
      class="size-20 mt-7 ml-2 flex items-center justify-center rounded-md overflow-hidden"
    >
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=128x128&data=TestQRCode&color=10217D&bgcolor=FFFFFF"
        alt="QR Code"
        class="w-full h-full object-cover"
      />
    </div>
    <div class="border-l-2 flex border-primaryBlue mx-7 mt-4"></div>
    <div class="flex flex-col justify-evenly">
      <div class="flex flex-row justify-start space-x-20 mt-4">
        <div class="flex flex-col justify-start">
          <p class="text-base font-bold font-poppins text-primaryBlue">
            Nom Complet:
          </p>
          <p>{{ patientName }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-base font-bold font-poppins text-primaryBlue">
            Sexe:
          </p>
          <p>{{ gender }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-base font-bold font-poppins text-primaryBlue">Age:</p>
          <p>{{ age }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-base font-bold font-poppins text-primaryBlue">
            Identificateur:
          </p>
          <p>{{ patientId }}</p>
        </div>
      </div>
      <div class="flex flex-grow space-x-12 justify-between mt-4">
        <div class="flex flex-row">
          <i class="fas fa-id-card mr-3 mt-4 text-primaryBlue"></i>

          <div class="flex flex-col justify-start">
            <p class="text-base font-bold font-poppins text-primaryBlue">
              Numéro de sécurité sociale:
            </p>
            <p>{{socialSecurityNumber}}</p>
          </div>
        </div>
        <div class="flex flex-row">
          <i class="fas fa-phone-alt mr-3 mt-4 text-primaryBlue"></i>
          <div class="flex flex-col justify-start">
            <p class="text-base font-bold font-poppins text-primaryBlue">
              Numéro de téléphone:
            </p>
            <p>{{ contactNumber }}</p>
          </div>
        </div>
        <div class="flex flex-row">
          <i class="fas fa-envelope mr-3 mt-4 text-primaryBlue"></i>
          <div class="flex flex-col justify-start">
            <p class="text-base font-bold font-poppins text-primaryBlue">
              E-mail:
            </p>
            <p>{{ email }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-row space-x-7 mt-8 max-w-screen ml-auto pr-4">
      <button
        class="bg-transparent hover:bg-blue-500 text-primaryBlue font-semibold hover:text-white py-2 px-4 border border-primaryBlue hover:border-transparent rounded h-12"
      >
        Consulter DPI
      </button>
      <button
        class="bg-transparent hover:bg-blue-500 text-teal-700 font-semibold hover:text-white py-2 px-4 border border-teal-700 hover:border-transparent rounded h-12"
      >
        <i class="fas fa-edit"></i>
      </button>
      <button
        class="bg-transparent hover:bg-blue-500 text-red-400 font-semibold hover:text-white py-2 px-4 border border-red-400 hover:border-transparent rounded h-12"
      >
        <i class="fas fa-trash"></i>
      </button>
    </div>
  </div>
</div>
