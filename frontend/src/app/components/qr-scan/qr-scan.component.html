<div class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 overflow-y-auto">
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-xl w-full mx-4 sm:mx-auto max-h-full overflow-y-auto relative">
    <!-- Close Button -->
    <button (click)="onClose()" class="absolute top-4 right-4 text-blue-500 w-8 h-8 rounded-full flex items-center justify-center text-xl font-bold cursor-pointer">
      X
    </button>

    <!-- Header -->
    <h1 class="text-lg text-center font-poppins text-primaryBlue font-bold mb-2">
      Scan QR
    </h1>

    <!-- Instructions -->
    <h2 class="text-center text-gray-700 mb-4">Click below to start scanning</h2>

    <!-- Start Scan Button -->
    <div class="flex justify-center mb-4">
  <button
    (click)="startScan()"
    class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-lg">
    Scan via Webcam
  </button>
  <label for="uploadInput" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-lg ml-5 cursor-pointer">
    Upload Image
  </label>
  <input
    id="uploadInput"
    type="file"
    accept="image/*"
    class="hidden"
    (change)="ReadQr($event)" />
</div>

    <!-- QR Scanner -->
    <div *ngIf="isScanning" class="mx-auto w-64 aspect-square relative bg-yellow-400">
      <zxing-scanner
        [formats]="allowedFormats"
        (scanSuccess)="onScanSuccess($event)"
        [device]="selectedDevice"
        class="absolute inset-0">
      </zxing-scanner>
    </div>

    <!-- Output Text Field -->
    <div>
      <label for="qrOutput" class="block text-gray-600 mb-2">Scanned QR Code:</label>
      <input
        id="qrOutput"
        type="text"
        [value]="scannedCode"
        readonly
        class="w-full p-2 border border-gray-300 rounded-lg" />
    </div>
    <div class="flex justify-center mb-4 mt-4">
      <button

        class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded-lg">
        Search
      </button>
    </div>
  </div>
</div>
