<div
  class="flex lg:flex-row flex-col lg:justify-between justify-center bg-white shadow-md rounded-lg p-5 mb-4"
>
  <h2 class="text-2xl lg:w-36 w-full font-bold font-poppins text-primaryBlue lg:mb-0 mb-5">
    {{ patientName }}
  </h2>
  <div class="flex lg:space-x-0 space-x-2 lg:flex-col flex-row justify-start">
    <p class="font-bold font-poppins text-primaryBlue text-xs">Nom Complet:</p>
    <p class="text-gray-500 lg:mt-1 font-poppins text-xs">
      {{ patientName }}
    </p>
  </div>
  <div class="flex lg:space-x-0 space-x-2 lg:flex-col flex-row justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">Sexe:</p>
    <p class="text-gray-500 lg:mt-1 font-poppins text-xs">{{ gender }}</p>
  </div>
  <div class="flex lg:space-x-0 space-x-2 lg:flex-col flex-row justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">Age:</p>
    <p class="text-gray-500 lg:mt-1 font-poppins text-xs">{{ age }}</p>
  </div>
  <div class="flex lg:space-x-0 space-x-2 lg:flex-col flex-row justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">
      Identificateur:
    </p>
    <p class="text-gray-500 lg:mt-1 font-poppins text-xs">{{ testId }}</p>
  </div>

  <div class="flex lg:space-x-0 space-x-2 lg:flex-col flex-row justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">
      tests à soumettre:
    </p>
    <p
      class="text-white w-fit px-3 lg:mt-1 font-poppins text-xs font-semibold mb-4 text-center rounded-sm py-0.5 bg-[#0F766E]"
    >
      {{ testsNeeded }}
    </p>
  </div>
  <button
    class="bg-transparent hover:bg-blue-500 text-primaryBlue font-bold hover:text-white py-2 px-3 border-2 border-primaryBlue flex items-center text-md hover:border-transparent rounded h-12 w-fit"
    (click)="togglePopup()"
  >
    <img class="size-8 mr-2" src="./assets/icons/bilan.png" />
    <span>Soumettre Bilan</span>
  </button>
</div>
<div>
    
</div>
<app-test-popup
  *ngIf="isPopupVisible"
  [patientName]="patientName"
  [gender]="gender"
  [age]="age"
  [testId]="testId"
  [testsNeeded]="testsNeeded"
  (closePopup)="togglePopup()"
></app-test-popup>
