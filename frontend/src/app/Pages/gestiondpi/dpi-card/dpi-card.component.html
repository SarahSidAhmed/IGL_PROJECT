<link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  rel="stylesheet"
/>
<div class="flex flex-col justify-between bg-white shadow-slate-200 rounded-lg p-5 mb-4" >
  <h2 class="text-xl font-bold font-poppins text-primaryBlue">
    {{ patientName }}
  </h2>
  <div class="flex xl:flex-row sm:flex-col" >
    <div
      class="size-16 mt-5 ml-4 flex items-center justify-center rounded-md overflow-hidden"
    >
      <img
        src="https://api.qrserver.com/v1/create-qr-code/?size=128x128&data=TestQRCode&color=10217D&bgcolor=FFFFFF"
        alt="QR Code"
        class="w-full h-full object-cover"
      />
    </div>
    <div class="border-l-2 flex border-primaryBlue mx-7 mt-4 mb-4"></div>
    <div class="flex flex-col justify-evenly">
      <div class="flex flex-row justify-start space-x-20 mt-4">
        <div class="flex flex-col justify-start">
          <p class=" font-bold font-poppins text-primaryBlue text-xs">
            Nom Complet:
          </p>
          <p class="text-gray-500 mt-1 font-poppins text-xs">{{ patientName }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-xs font-bold font-poppins text-primaryBlue">
            Sexe:
          </p>
          <p class="text-gray-500 mt-1 font-poppins text-xs">{{ gender }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-xs font-bold font-poppins text-primaryBlue">Age:</p>
          <p class="text-gray-500 mt-1 font-poppins text-xs">{{ age }}</p>
        </div>
        <div class="flex flex-col justify-start">
          <p class="text-xs font-bold font-poppins text-primaryBlue">
            Identificateur:
          </p>
          <p class="text-gray-500 mt-1 font-poppins text-xs">{{ patientId }}</p>
        </div>
      </div>
      <div class="flex flex-grow space-x-12 justify-between mt-4">
        <div class="flex flex-row">
          <i class="fas fa-id-card mr-3 mt-4 text-primaryBlue"></i>

          <div class="flex flex-col justify-start">
            <p class="text-xs font-bold font-poppins text-primaryBlue">
              Numéro de sécurité sociale:
            </p>
            <p class="text-gray-500 mt-1 font-poppins text-xs">{{socialSecurityNumber}}</p>
          </div>
        </div>
        <div class="flex flex-row">
          <i class="fas fa-phone-alt mr-3 mt-4 text-primaryBlue"></i>
          <div class="flex flex-col justify-start">
            <p class="text-xs font-bold font-poppins text-primaryBlue">
              Numéro de téléphone:
            </p>
            <p class="text-gray-500 mt-1 font-poppins text-xs">{{ contactNumber }}</p>
          </div>
        </div>
        <div class="flex flex-row">
          <i class="fas fa-envelope mr-3 mt-4 text-primaryBlue"></i>
          <div class="flex flex-col justify-start">
            <p class="text-xs font-bold font-poppins text-primaryBlue">
              E-mail:
            </p>
            <p class="text-gray-500 mt-1 font-poppins text-xs">{{ email }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-row space-x-6 mt-8 max-w-screen ml-auto pr-4">
      <button
        class="bg-transparent hover:bg-blue-500 text-primaryBlue font-semibold hover:text-white py-2 px-4 border-2 border-primaryBlue flex items-center hover:border-transparent rounded h-12"
      >
      <img class="h-5 w-5 mr-3" src="./assets/icons/consulter dpi.png" />
      <span>Consulter DPI</span>
      </button>
      <button
        class="bg-transparent hover:bg-blue-500 text-teal-700 font-semibold hover:text-white py-2 px-4 border-2 border-teal-700 hover:border-transparent rounded h-12"
        (click)="onEdit()"
      >
        <i class="fas fa-edit"></i>
      </button>
      <button
        class="bg-transparent hover:bg-blue-500 text-red-400 font-semibold hover:text-white py-2 px-4 border-2 border-red-400 hover:border-transparent rounded h-12"
        (click)="confirmAndDelete()"
      >
        <i class="fas fa-trash"></i>
      </button>
      <div *ngIf="isModalOpen" class="fixed inset-0 flex items-center justify-center  bg-black bg-opacity-50 z-50">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
          <h3 class="text-lg font-semibold mb-4">Are you sure you want to delete this patient?</h3>
          <div class="flex justify-between">
            <button 
              class="bg-red-500 text-white px-4 py-2 rounded mr-2"
              (click)="onConfirmDeletion()">Yes</button>
            <button 
              class="bg-gray-300 text-black px-4 py-2 rounded"
              (click)="closeModal()">No</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
