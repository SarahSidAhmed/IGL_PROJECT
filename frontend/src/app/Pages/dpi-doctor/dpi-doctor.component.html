<div class="min-h-screen bg-[#F1FFFC] lg:flex lg:flex-col">
  <app-navbar></app-navbar>
  
  <div class="lg:flex lg:flex-1 p-4 gap-4">
    <div class="flex-1 overflow-y-auto rounded-lg px-4">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-[#10217D]">Consultations</h2>
        <button
          class="bg-[#008080] text-sm text-white font-bold px-4 py-2 rounded-md flex items-center gap-2"
          (click)="toggleAddConsultation()"
        >
          <img src="assets/plus.svg" alt="Add" class="h-4 w-4" />
          Ajouter Consultation
        </button>
      </div>
      <div *ngFor="let consultation of consultations" class="mb-4">
        <app-consultation-card [consultation]="consultation"></app-consultation-card>
      </div>
    </div>
    <div class="lg:w-1/3 lg:flex lg:flex-col gap-4 md:flex md:flex-row">
      <div class="rounded-lg px-4 py-2 lg:flex-none md:flex-1">
        <app-info-card [patient]="dpi"></app-info-card>
      </div>
      <div class="rounded-lg px-4 py-2 lg:flex-none md:flex-1">
        <app-test-card [dpiId]="dpi.id"></app-test-card>
      </div>
    </div>
  </div>
</div>
