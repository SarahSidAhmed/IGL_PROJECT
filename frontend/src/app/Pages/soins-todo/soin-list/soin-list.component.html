<div class="flex flex-col h-screen bg-backGround">
  <app-navbar></app-navbar>
  <div class="flex justify-center mt-4 mb-3">
    <h1 class="text-primaryBlue font-poppins text-xl font-bold">
      Liste des soins à soumettre
    </h1>
  </div>
  <div class="flex flex-row justify-center">
    <div
      class="flex flex-row justify-between h-16 w-2/3 bg-white shadow-sm items-center rounded-lg sm:mr-8"
    >
      <div class="flex-grow relative p-4">
        <input
          type="text"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Rechercher par NSS..."
          [(ngModel)]="searchQuery"
          class="w-full p-1 bg-slate-100 border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 placeholder:font-poppins placeholder:text-xs placeholder:pl-4"
        />
      </div>
      <button
        class="text-white p-1 rounded-md focus:outline-none"
        (click)="scanQrCode()"
      >
        <img class="size-7" src="./assets/icons/scanQr.png" />
      </button>
    </div>
  </div>
  <div class="m-7 mb-0 mt-3 overflow-y-auto custom-scrollbar">
    <app-soin-card
      *ngFor="let soin of nursingRecords"
      [patientName]="soin.dpi.first_name + ' ' + soin.dpi.last_name"
      [gender]="soin.dpi.gender"
      [age]="calculateAge(soin.dpi.birthdate)"
      [soinId]="soin.id"
      [soinNeeded]="soin.care_name"
    ></app-soin-card>
  </div>
  <app-qr-scan
    *ngIf="scanQrVisible"
    (searchDpi)="searchSoin($event)"
    (closePopup)="scanQrCode()"
  ></app-qr-scan>
</div>
