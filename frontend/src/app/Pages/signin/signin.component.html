<div class="flex flex-col items-center justify-center min-h-screen bg-[#F1FFFC]">
  <img
    src="assets/logo2.svg"
    alt="Logo"
    class="w-25 h-24 mb-8"
  />
  <div class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold mb-4 text-center text-[#1BA9B5]">Connexion</h2>
    <form (ngSubmit)="login()">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#10217D]"
          required
        />
      </div>
      <div class="mb-4 relative">
        <label for="password" class="block text-gray-700 font-medium">Mot de passe</label>
        <div class="relative">
          <input
            [type]="passwordVisible ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#10217D] pr-10 mb-4"
            required
          />
          <img
            (click)="togglePasswordVisibility()"
            [src]="passwordVisible ? 'assets/visible.svg' : 'assets/invisible.svg'"
            alt="Toggle Password Visibility"
            class="absolute right-4 top-1/2 transform -translate-y-3.5 w-4 h-4 cursor-pointer"
          />
        </div>
      </div>
      <button
        type="submit"
        class="w-1/2 p-2 bg-[#10217D] text-white rounded-md hover:bg-[#16C2D5] block mx-auto"
      >
        Connexion
      </button>
    </form>
  </div>
</div>
