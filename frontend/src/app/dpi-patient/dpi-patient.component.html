<div class="bg-[#F1FFFC] lg:flex lg:flex-col">
    <!-- Navbar -->
    <app-navbar></app-navbar>
  
    <!-- Main Content -->
    <div class="lg:flex lg:flex-1 p-4 gap-4">
      <!-- Left Side: Scrollable List -->
      <div class="flex-1 overflow-y-auto rounded-lg px-4">
        <h2 class="text-lg font-bold mb-4 text-[#10217D]">Consultations</h2>
        <div *ngFor="let consultation of consultations" class="mb-4">
          <app-consultation-card></app-consultation-card>
        </div>
      </div>
  
      <!-- Right Side: Info Card and Test Card -->
      <div class="lg:w-1/3 lg:flex lg:flex-col gap-4 md:flex md:flex-row">
        <!-- Info Card -->
        <div class="rounded-lg px-4 py-2 flex-1">
          <app-info-card></app-info-card>
        </div>
  
        <!-- Test Card -->
        <div class="rounded-lg px-4 py-2 flex-1">
          <app-test-card></app-test-card>
        </div>
      </div>
    </div>
  </div>
<router-outlet />
