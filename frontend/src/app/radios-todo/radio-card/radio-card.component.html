<div
  class="flex sm:flex-row flex-col justify-between bg-white shadow-md rounded-lg p-5 mb-4"
>
  <h2 class="text-2xl w-36 font-bold font-poppins text-primaryBlue">
    {{ patientName }}
  </h2>
  <div class="flex flex-col justify-start">
    <p class="font-bold font-poppins text-primaryBlue text-xs">Nom Complet:</p>
    <p class="text-gray-500 mt-1 font-poppins text-xs">
      {{ patientName }}
    </p>
  </div>
  <div class="flex flex-col justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">Sexe:</p>
    <p class="text-gray-500 mt-1 font-poppins text-xs">{{ gender }}</p>
  </div>
  <div class="flex flex-col justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">Age:</p>
    <p class="text-gray-500 mt-1 font-poppins text-xs">{{ age }}</p>
  </div>
  <div class="flex flex-col justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">
      Identificateur:
    </p>
    <p class="text-gray-500 mt-1 font-poppins text-xs">{{ patientId }}</p>
  </div>
  
  <div class="flex flex-col justify-start">
    <p class="text-xs font-bold font-poppins text-primaryBlue">
      Radio à soumettre:
    </p>
    <p class="text-white w-fit px-3 mt-1 font-poppins text-xs font-semibold mb-4 text-center rounded-sm py-0.5 bg-[#0F766E]">{{ radioNeeded }}</p>
  </div>
  <button class="bg-transparent hover:bg-blue-500 text-primaryBlue font-bold hover:text-white py-2 px-3 border-2 border-primaryBlue flex items-center text-md  hover:border-transparent rounded h-12">
    <img class="size-10 mr-2" src="./assets/icons/radio.png" />
    <span>Soumettre Radio</span>
  </button>
</div>
