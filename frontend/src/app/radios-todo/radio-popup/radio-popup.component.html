<div
  class="fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center z-50 overflow-y-auto"
>
  <div class="bg-white p-6 rounded-lg shadow-lg max-w-3xl w-full mx-4 sm:mx-auto max-h-full overflow-y-auto">
    <h1
      class="text-lg text-center font-poppins text-primaryBlue font-bold mb-2"
    >
      Saisir les informations sur le radio
    </h1>
    <div class="flex flex-row items-center mb-1 space-x-2">
      <h1 class="font-poppins font-bold text-sm text-primaryBlue">
        Informations
      </h1>
      <div class="flex-grow border-t-2 border-primaryBlue"></div>
    </div>
    <div
      class="flex sm:flex-row flex-col justify-around bg-white rounded-lg pt-4 pb-0 gap-5"
    >
      <div class="flex flex-col justify-start">
        <p class="font-bold font-poppins text-primaryBlue text-xs">
          Nom Complet:
        </p>
        <p class="text-gray-500 mt-1 font-poppins text-xs">
          {{ patientName }}
        </p>
      </div>
      <div class="flex flex-col justify-start">
        <p class="text-xs font-bold font-poppins text-primaryBlue">Sexe:</p>
        <p class="text-gray-500 mt-1 font-poppins text-xs">{{ gender }}</p>
      </div>
      <div class="flex flex-col justify-start">
        <p class="text-xs font-bold font-poppins text-primaryBlue">Age:</p>
        <p class="text-gray-500 mt-1 font-poppins text-xs">{{ age }}</p>
      </div>
      <div class="flex flex-col justify-start">
        <p class="text-xs font-bold font-poppins text-primaryBlue">
          Identificateur:
        </p>
        <p class="text-gray-500 mt-1 font-poppins text-xs">{{ patientId }}</p>
      </div>
      <div class="flex flex-col justify-start">
        <p class="text-xs font-bold font-poppins text-primaryBlue">
          Radio à soumettre:
        </p>
        <p
          class="text-white w-fit px-3 mt-1 font-poppins text-xs font-semibold mb-4 text-center rounded-sm py-0.5 bg-[#0F766E]"
        >
          {{ radioNeeded }}
        </p>
      </div>
    </div>
    <form>
      <div class="flex flex-row items-center mb-3 space-x-2">
        <h1 class="font-poppins font-bold text-sm text-primaryBlue">
          Compte rendu
        </h1>
        <div class="flex-grow border-t-2 border-primaryBlue"></div>
      </div>
      <input
        type="text"
        placeholder="Compte rendu"
        class="w-full h-20 mb-4 p-2 rounded bg-slate-200 placeholder:font-poppins placeholder:text-xs placeholder:text-start"
      />
      <label class="block text-sm font-bold mb-2 text-primaryBlue font-poppins"
        >Importer un fichier</label
      >
      <div class="flex items-center mb-10 space-x-2">
        <input
          type="text"
          class="w-full p-2 py-2.5 border rounded bg-slate-200 text-xs placeholder:font-poppins"
          placeholder="No file chosen"
          readonly
          [value]="selectedFileName || ''"
        />
        <div class="relative">
          <input
            type="file"
            id="fileInput"
            class="hidden"
            (change)="onFileSelected($event)"
          />
          <label
            for="fileInput"
            class="bg-primaryBlue text-white px-5 py-2 pt-2.5 rounded text-center cursor-pointer text-sm font-poppins font-semibold"
          >
            Open
          </label>
        </div>
      </div>
      <div class="flex flex-row sm:justify-end gap-6 mt-10 -space-x-4">
        <button
          class="sm:px-4 sm:py-2 px-5 font-semibold font-poppins text-[#0F766E] transition-all duration-300 sm:text-sm text-xs bg-white border-2 border-[#0F766E] items-center flex rounded-md hover:bg-primaryBlue-dark focus:outline-none focus:ring-0"
          type="submit"
        >
          <img class="sm:h-5 sm:w-6 size-3 mr-3" src="./assets/icons/save.png" />
          <span>Confirmer et ajouter</span>
        </button>
        <button
          class="sm:px-4 sm:py-2 px-5 font-semibold font-poppins text-[#F87171] transition-all duration-300 sm:text-sm text-xs bg-white border-2 border-[#F87171] rounded-md hover:bg-primaryBlue-dark items-center flex focus:outline-none focus:ring-0"
          type="reset"
        >
          <img class="sm:h-5 sm:w-5 size-3 mr-3" src="./assets/icons/cancel.png" />
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
